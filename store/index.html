<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIMDT · Sim Racing Store</title>
<meta name="description" content="SIMDT 官方商店 — 赛车模拟方向盘、触觉反馈马达、风力模拟系统、按钮盒与仪表盘。SIMDT official store for sim racing hardware." />
<link rel="canonical" href="https://www.simdt.cn/store/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="SIMDT" />
<meta property="og:title" content="SIMDT · Sim Racing Store" />
<meta property="og:description" content="Official SIMDT store — steering wheels, haptic motors, wind simulation, button boxes and dashboards." />
<meta property="og:url" content="https://www.simdt.cn/store/" />
<meta property="og:image" content="https://www.simdt.cn/images/product-dt7pro.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://www.simdt.cn/images/product-dt7pro.jpg" />

<style>
:root {
  --black: #0A0A0A;
  --red: #E63946;
  --gold: #C9A84C;
  --bg: #0A0A0A;
  --panel: #141414;
  --panel-2: #1c1c1c;
  --text: #f5f5f5;
  --muted: #9a9a9a;
  --border: #2a2a2a;
  --radius: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

/* ---------- Header ---------- */
#site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10, 10, 10, 0.92);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.nav-top {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 14px 20px;
}
.brand {
  font-weight: 800;
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--red);
}
.nav-links { display: flex; gap: 16px; align-items: center; flex: 1; flex-wrap: wrap; }
.nav-link { color: var(--text); font-size: 14px; opacity: .85; transition: .15s; }
.nav-link:hover { opacity: 1; color: var(--gold); }
.nav-admin { color: var(--gold); font-weight: 600; }
.nav-user { font-size: 12px; color: var(--muted); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge {
  background: var(--red);
  color: #fff;
  border-radius: 999px;
  font-size: 11px;
  padding: 1px 7px;
  margin-left: 2px;
}
.nav-tools { display: flex; gap: 8px; }
.tool-btn {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 13px;
}
.tool-btn:hover { border-color: var(--gold); }

/* ---------- Layout ---------- */
#app { flex: 1; max-width: 1180px; width: 100%; margin: 0 auto; padding: 28px 20px 60px; }
.section { margin-bottom: 40px; }
.section-title { font-size: 22px; font-weight: 700; margin-bottom: 18px; border-left: 4px solid var(--red); padding-left: 12px; }

/* ---------- Hero ---------- */
.hero {
  background: linear-gradient(135deg, #141414 0%, #0a0a0a 60%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 64px 40px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before { content: ''; position: absolute; left: 0; top: 0; height: 6px; width: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); }
.hero-title { font-size: 38px; font-weight: 800; letter-spacing: 1px; }
.hero-sub { color: var(--muted); margin: 14px 0 26px; font-size: 16px; }
.hero-cta { display: inline-block; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-block;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: .15s;
}
.btn:hover { border-color: var(--gold); }
.btn-primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-gold { background: var(--gold); border-color: var(--gold); color: #1a1a1a; font-weight: 700; }
.btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn-block { display: block; width: 100%; text-align: center; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- Product grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: .15s;
}
.card:hover { border-color: var(--gold); transform: translateY(-2px); }
.card-img { aspect-ratio: 4/3; background: #000; overflow: hidden; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-cat { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
.card-title { font-weight: 600; font-size: 15px; line-height: 1.35; }
.card-title .zh { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; margin-top: 3px; }
.card-price { color: var(--red); font-weight: 700; font-size: 18px; margin-top: auto; }

/* 规格标签（详情页） */
.spec-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
.spec-pill {
  font-size: 12px; padding: 4px 10px; border: 1px solid var(--border);
  border-radius: 999px; color: var(--muted); background: var(--panel);
}
.card-actions { display: flex; gap: 8px; margin-top: 6px; }
.card-actions .btn { flex: 1; text-align: center; padding: 8px; }

/* ---------- Filters ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.chip {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 13px;
}
.chip.active { color: #1a1a1a; background: var(--gold); border-color: var(--gold); font-weight: 600; }

/* ---------- Forms ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
.row { display: flex; gap: 14px; }
.row > * { flex: 1; }

/* ---------- Cart / Checkout ---------- */
.cart-item, .order-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 14px;
}
.cart-item img, .order-item img { width: 84px; height: 64px; object-fit: cover; border-radius: 6px; background: #000; }
.cart-item .info { flex: 1; }
.cart-qty { width: 64px; }
.summary {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-top: 10px;
}
.summary .line { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--muted); }
.summary .total { color: var(--text); font-weight: 700; font-size: 18px; border-top: 1px solid var(--border); padding-top: 10px; }

.pay-methods { display: flex; flex-direction: column; gap: 10px; }
.pay-opt {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--border); background: var(--panel);
  border-radius: 8px; padding: 14px; cursor: pointer;
}
.pay-opt.active { border-color: var(--gold); }
.pay-opt .disabled-tag { margin-left: auto; font-size: 12px; color: var(--muted); }
.pay-opt.locked { opacity: .55; cursor: not-allowed; }

/* ---------- Orders ---------- */
.order-items { margin-top: 10px; }
.order-item { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); }
.order-item img { width: 48px; height: 36px; object-fit: cover; border-radius: 4px; }
.order-meta { color: var(--muted); font-size: 13px; }
.status-pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); }
.status-paid { color: #4ade80; border-color: #4ade80; }
.status-pending { color: var(--gold); border-color: var(--gold); }
.status-shipped { color: #60a5fa; border-color: #60a5fa; }
.status-cancelled, .status-failed { color: var(--muted); }
.status-inquiry { color: var(--gold); border-color: var(--gold); }
.status-quoted { color: #4ade80; border-color: #4ade80; }
.note-box {
  margin-top: 6px; padding: 8px 10px; border-radius: 6px;
  background: rgba(255,255,255,.04); border-left: 2px solid var(--gold);
  color: var(--muted); font-size: 12px; line-height: 1.6; max-width: 260px;
}

/* ---------- Admin ---------- */
.admin-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
.table th { color: var(--muted); font-weight: 600; }
.table img { width: 56px; height: 42px; object-fit: cover; border-radius: 4px; }
.table select {
  background: #141414; color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; margin-right: 6px;
}
.table select:focus { outline: none; border-color: var(--gold); }

/* ---------- Modal ---------- */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; }
.modal-box h3 { margin-bottom: 14px; }

/* ---------- Toast ---------- */
#toast { position: fixed; top: 76px; right: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: 10px 14px; border-radius: 8px; font-size: 13px; min-width: 180px; }
.toast-error { border-left-color: var(--red); }
.toast-success { border-left-color: #4ade80; }

/* ---------- Footer ---------- */
#site-footer { border-top: 1px solid var(--border); margin-top: auto; }
.footer-inner { max-width: 1180px; margin: 0 auto; padding: 22px 20px; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }

.empty { text-align: center; color: var(--muted); padding: 60px 0; }

/* ---------- Responsive ---------- */
@media (max-width: 768px) {
  .hero { padding: 44px 20px; }
  .hero-title { font-size: 28px; }
  .nav-top { flex-wrap: wrap; }
  .nav-links { order: 3; width: 100%; }
  .row { flex-direction: column; gap: 0; }
}

</style>

<body>
<header id="site-header"></header>
<main id="app"></main>
<footer id="site-footer"></footer>
<div id="toast"></div>
<script>

/* ===== cloud.js ===== */
// SIMDT store — site config (pure front-end, no backend / no secrets).
//
// This site is fully static: product catalog, cart, orders and sign-in all live
// in the browser (localStorage). It can be hosted on ANY static host (your own
// server, Vercel, Netlify, Cloudflare Pages, Aliyun OSS+CDN …) under your own
// domain such as www.simdt.cn — there is no WorkBuddy cloud dependency and no
// Origin restriction.

// Admin emails that may access the management dashboard.
// Change this to your real operator accounts before going live.
const ADMIN_EMAILS = ['simdt@qq.com']

// Payment provider keys. Leave empty to keep the method in "not connected" state.
// Fill these after you obtain merchant accounts (Stripe / PayPal / WeChat / Alipay),
// then wire the real redirect / checkout in pages.js (checkout()). The "demo" method
// marks the order paid immediately for testing the flow without a real gateway.
const PAYMENT_KEYS = {
  stripe: '',
  paypal: '',
  wechat: '',
  alipay: '',
}

// Optional: point orders at your own backend (e.g. a form endpoint, email API, or
// Supabase). Leave empty to keep orders in the browser only. When set, checkout()
// will POST the order JSON here after placing it.
// Example: 'https://your-server.example.com/api/orders'
const ORDER_WEBHOOK_URL = ''

/* ===== supabase.js ===== */
// SIMDT store — 轻量 Supabase 客户端（无 SDK 依赖，纯 fetch）
//
// 为什么不引入 @supabase/supabase-js：
//   官方 SDK 打包后 100KB+，而站点是"单文件自包含"架构（CSS/JS 全内联）。
//   这里只需 4 个能力：注册、密码登录、刷新令牌、PostgREST 增删改查，
//   手写约 200 行即可，体积小、行为可控、也不会因 SDK 升级而失效。
//
// 安全说明：anon key 是「公开密钥」，设计上就要放在前端。真正的权限由
//   Supabase 的行级安全策略（RLS）在数据库端强制，前端改不了。

// ============ 配置（唯一需要你改的地方）============
// 在 Supabase 控制台 → Project Settings → API 里复制：
//   Project URL  -> 形如 https://abcdefghijklmn.supabase.co
//   anon public  -> 一长串 eyJhbGciOi... 开头的 JWT
const SUPABASE_URL = 'https://lmmmbvgqclporttdvukh.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtbW1idmdxY2xwb3J0dGR2dWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMTIyODIsImV4cCI6MjEwODc4ODI4Mn0.enUbaQecpd27Vhbzb-V0qFNHbWS0xxS62m4_dkx2hvQ'

function isConfigured() {
  return /^https?:\/\/.+/.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 40
}

// ============ 会话存储 ============
const SESSION_KEY = 'simdt_sb_session'

function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || null } catch { return null }
}

function saveSession(s) {
  localStorage.setItem(SESSION_KEY, JSON.stringify(s))
}

function clearSession() {
  localStorage.removeItem(SESSION_KEY)
}

function sessionUser(s) {
  if (!s || !s.user) return null
  return { id: s.user.id, email: s.user.email, is_admin: !!s.is_admin }
}

// ============ 底层请求 ============
function baseUrl() {
  return SUPABASE_URL.replace(/\/+$/, '')
}

function parseError(status, payload) {
  const msg =
    payload?.msg || payload?.message || payload?.error_description ||
    payload?.error || payload?.hint || `HTTP ${status}`
  const err = new Error(msg)
  err.status = status
  err.payload = payload
  return err
}

async function rawFetch(path, { method = 'GET', body, token, headers = {} } = {}) {
  if (!isConfigured()) throw new Error('backend_not_configured')
  const h = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${token || SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json',
    ...headers,
  }
  const res = await fetch(baseUrl() + path, {
    method,
    headers: h,
    body: body === undefined ? undefined : JSON.stringify(body),
  })
  const text = await res.text()
  let data = null
  if (text) { try { data = JSON.parse(text) } catch { data = text } }
  if (!res.ok) throw parseError(res.status, data)
  return data
}

// ============ 令牌刷新 ============
let refreshing = null

async function refreshSession(s) {
  if (!s?.refresh_token) throw new Error('no_refresh_token')
  const data = await rawFetch('/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    body: { refresh_token: s.refresh_token },
  })
  const next = {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (data.expires_in || 3600) * 1000,
    user: data.user,
    is_admin: s.is_admin,
  }
  saveSession(next)
  return next
}

// 取一个可用 token；快过期就先刷新（并发请求共用同一次刷新）
async function validToken() {
  const s = loadSession()
  if (!s?.access_token) return null
  if (s.expires_at && s.expires_at - Date.now() > 30000) return s.access_token
  if (!refreshing) {
    refreshing = refreshSession(s).finally(() => { refreshing = null })
  }
  try {
    const next = await refreshing
    return next.access_token
  } catch {
    clearSession()
    return null
  }
}

// 带自动重试的请求：遇到 401 刷新一次再试
async function authedFetch(path, opts = {}) {
  const token = await validToken()
  try {
    return await rawFetch(path, { ...opts, token })
  } catch (e) {
    if (e.status === 401 && token) {
      const s = loadSession()
      const next = await refreshSession(s)
      return await rawFetch(path, { ...opts, token: next.access_token })
    }
    throw e
  }
}

// ============ Auth ============
function normalizeAuthError(e) {
  const m = String(e.message || '')
  if (/Invalid login credentials/i.test(m)) return new Error('wrong_credentials')
  if (/already registered|already exists/i.test(m)) return new Error('email_registered')
  if (/Password should be at least/i.test(m)) return new Error('password_too_short')
  if (/Unable to validate email address/i.test(m)) return new Error('invalid_email')
  if (/Email not confirmed/i.test(m)) return new Error('email_not_confirmed')
  if (/backend_not_configured/.test(m)) return new Error('backend_not_configured')
  return e
}

async function probeAdmin() {
  try {
    const r = await authedFetch('/rest/v1/rpc/is_admin', { method: 'POST', body: {} })
    return r === true || r === 'true'
  } catch { return false }
}

const auth = {
  async signUp(email, password) {
    let data
    try {
      data = await rawFetch('/auth/v1/signup', { method: 'POST', body: { email, password } })
    } catch (e) { throw normalizeAuthError(e) }

    // 项目开启「邮箱验证」时 signup 不返回 token，需要用户先去邮箱点确认
    if (!data?.access_token) {
      const err = new Error('confirm_email_sent')
      err.needsConfirm = true
      throw err
    }
    const session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in || 3600) * 1000,
      user: data.user,
      is_admin: false,
    }
    saveSession(session)
    session.is_admin = await probeAdmin()
    saveSession(session)
    window.dispatchEvent(new Event('auth-changed'))
    return sessionUser(session)
  },

  async signIn(email, password) {
    let data
    try {
      data = await rawFetch('/auth/v1/token?grant_type=password', {
        method: 'POST',
        body: { email, password },
      })
    } catch (e) { throw normalizeAuthError(e) }

    const session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in || 3600) * 1000,
      user: data.user,
      is_admin: false,
    }
    saveSession(session)
    session.is_admin = await probeAdmin()
    saveSession(session)
    window.dispatchEvent(new Event('auth-changed'))
    return sessionUser(session)
  },

  async signOut() {
    const s = loadSession()
    clearSession()
    if (s?.access_token && isConfigured()) {
      try { await rawFetch('/auth/v1/logout', { method: 'POST', token: s.access_token }) } catch { /* ignore */ }
    }
    window.dispatchEvent(new Event('auth-changed'))
  },

  getUser() {
    return sessionUser(loadSession())
  },

  // 页面加载时恢复会话：token 过期会自动刷新
  async restore() {
    const s = loadSession()
    if (!s?.refresh_token) return null
    try {
      const token = await validToken()
      if (!token) return null
      const fresh = loadSession()
      if (fresh && fresh.is_admin === undefined) {
        fresh.is_admin = await probeAdmin()
        saveSession(fresh)
      }
      return sessionUser(loadSession())
    } catch {
      clearSession()
      return null
    }
  },
}

// ============ PostgREST ============
// query 直接用 PostgREST 语法，例如 'status=eq.published&order=sort_order.asc'
const db = {
  async select(table, query = '') {
    const q = query ? `?${query}` : ''
    return await authedFetch(`/rest/v1/${table}${q}`)
  },

  // opts.returning = false 时不要求数据库回传整行（return=minimal）。
  // 游客下单必须用这个：anon 对 orders 没有 SELECT 策略，
  // 一旦要 representation，PostgREST 会因无权 RETURNING 而整条插入失败。
  async insert(table, row, opts = {}) {
    const returning = opts.returning !== false
    const data = await authedFetch(`/rest/v1/${table}`, {
      method: 'POST',
      body: row,
      headers: { Prefer: returning ? 'return=representation' : 'return=minimal' },
    })
    return Array.isArray(data) ? data[0] : data
  },

  // 插入多行
  async insertMany(table, rows) {
    return await authedFetch(`/rest/v1/${table}`, {
      method: 'POST',
      body: rows,
      headers: { Prefer: 'return=representation' },
    })
  },

  // match 形如 'id=eq.3'
  async update(table, patch, match) {
    const data = await authedFetch(`/rest/v1/${table}?${match}`, {
      method: 'PATCH',
      body: patch,
      headers: { Prefer: 'return=representation' },
    })
    return Array.isArray(data) ? data[0] : data
  },

  async remove(table, match) {
    return await authedFetch(`/rest/v1/${table}?${match}`, { method: 'DELETE' })
  },

  async rpc(fn, args = {}) {
    return await authedFetch(`/rest/v1/rpc/${fn}`, { method: 'POST', body: args })
  },
}

let lang = localStorage.getItem('simdt_lang') || 'zh'
let currency = localStorage.getItem('simdt_currency') || (lang === 'zh' ? 'CNY' : 'USD')

function getLang() { return lang }
function setLang(l) { lang = l; localStorage.setItem('simdt_lang', l) }
function getCurrency() { return currency }
function setCurrency(c) { currency = c; localStorage.setItem('simdt_currency', c) }

function t(key) {
  return (dict[lang] && dict[lang][key]) || dict.en[key] || key
}

function money(amount) {
  const sym = currency === 'CNY' ? '¥' : '$'
  return sym + Number(amount || 0).toFixed(2)
}

// 美元价 / 人民币价 只填一个时按此汇率互相折算（后台可分别填两个价覆盖）
const USD_CNY = 7.2

function productPrice(p) {
  const usd = Number(p.price_usd || 0)
  const cny = Number(p.price_cny || 0)
  if (currency === 'CNY') {
    if (cny > 0) return cny
    return usd > 0 ? Math.round(usd * USD_CNY) : 0
  }
  if (usd > 0) return usd
  return cny > 0 ? Math.round((cny / USD_CNY) * 100) / 100 : 0
}

// 价格为 0 视为未定价 → 显示「询价」
function isInquiry(p) {
  return !(Number(productPrice(p)) > 0)
}

function priceText(p) {
  return isInquiry(p) ? t('price_request') : money(productPrice(p))
}

// SIMDT store — optional live chat widget (Tawk.to).
// Leave propertyId / widgetId empty to keep the store fully self-contained:
// inquiry buttons then fall back to the plain email link.



const CHAT_CONFIG = {
  propertyId: '6aeae99fb78df63c3544aaf8',
  widgetId: '1k6iq173v',
}

function chatReady() {
  return !!(CHAT_CONFIG.propertyId && CHAT_CONFIG.widgetId)
}

function chatInit() {
  if (!chatReady() || window.__simdtChatLoaded) return
  // The brand site embeds this page in an iframe as a fallback; the parent
  // already runs the widget, so skip it here to avoid two chat bubbles.
  if (window.top !== window.self) return
  window.__simdtChatLoaded = true
  window.Tawk_API = window.Tawk_API || {}
  window.Tawk_LoadStart = new Date()
  const s1 = document.createElement('script')
  s1.async = true
  s1.src = 'https://embed.tawk.to/' + CHAT_CONFIG.propertyId + '/' + CHAT_CONFIG.widgetId
  s1.charset = 'UTF-8'
  s1.setAttribute('crossorigin', '*')
  document.head.appendChild(s1)
}

// If the widget never comes up (blocked network, ad blocker) tell the visitor
// rather than silently doing nothing — the email address is in the message.
function chatUnavailable() {
  toast(t('chat_unavailable'), 'error')
}

// Open the chat panel, tagged with the product the visitor is looking at so the
// agent sees "asking about DT7 Pro" instead of a cold "Hello?".
function chatOpen(productName) {
  if (!chatReady()) return false
  let tries = 0
  const fire = () => {
    const api = window.Tawk_API
    if (api && typeof api.maximize === 'function') {
      if (productName) {
        try {
          api.addEvent('product_inquiry', { product: productName, page: location.href })
        } catch (e) { /* event tagging is best-effort */ }
      }
      api.maximize()
      return
    }
    // Tawk pulls its bundles asynchronously; a cold first visit can take ~10s,
    // so keep waiting instead of declaring failure after a couple of seconds.
    if (tries++ < 80) { setTimeout(fire, 150); return }
    chatUnavailable()
  }
  fire()
  return true
}

// SIMDT store — shopping cart (localStorage, guest-friendly)


const KEY = 'simdt_cart'

function read() {
  try { return JSON.parse(localStorage.getItem(KEY)) || [] } catch { return [] }
}
function write(items) {
  localStorage.setItem(KEY, JSON.stringify(items))
  window.dispatchEvent(new Event('cart-updated'))
}

function getCart() { return read() }
function cartCount() { return read().reduce((s, i) => s + i.qty, 0) }

function addToCart(product, qty = 1) {
  const items = read()
  const ex = items.find(i => i.id === product.id)
  if (ex) ex.qty += qty
  else items.push({
    id: product.id,
    qty,
    name_en: product.name_en,
    name_zh: product.name_zh,
    price_usd: product.price_usd,
    price_cny: product.price_cny,
    image_url: product.image_url,
    stock: product.stock,
  })
  write(items)
}

function updateQty(id, qty) {
  const items = read()
  const it = items.find(i => i.id === id)
  if (it) { it.qty = Math.max(1, qty | 0); write(items) }
}

function removeFromCart(id) {
  write(read().filter(i => i.id !== id))
}

function clearCart() { write([]) }

function cartSubtotal() {
  // 走 productPrice 而不是裸 price_cny/price_usd：
  // 后台只填一种币种时按汇率折算出另一种，否则另一种币种下合计会是 0。
  return read().reduce((s, i) => s + i.qty * Number(productPrice(i) || 0), 0)
}

// 购物车里是否含「未定价」商品 → 整单走询价单流程，而不是直接下单
function hasInquiryItems() {
  return read().some(i => isInquiry(i))
}

// 只统计已定价部分（询价商品按 0 计），用于询价单里显示「已定价小计」
function pricedSubtotal() {
  return read().reduce((s, i) => s + (isInquiry(i) ? 0 : i.qty * Number(productPrice(i) || 0)), 0)
}

/* ===== api.js ===== */
// SIMDT store — 数据层（Supabase 真后端）
//
// 所有商品与订单都存在 Supabase 数据库里，任何设备、任何访客看到的都是同一份数据。
// 未配置后端时（js/supabase.js 里的 URL/KEY 为空）自动降级为内置目录只读展示，
// 这样你可以先预览页面、配好密钥后自动切到真数据。




const NO_BACKEND = 'backend_not_configured'

function ensureBackend() {
  if (!isConfigured()) throw new Error(NO_BACKEND)
}

// ---------------- 商品 ----------------

async function listProducts({ category, featured } = {}) {
  if (!isConfigured()) {
    let items = PRODUCTS.filter(p => (p.status || 'published') === 'published')
    if (category && category !== 'all') items = items.filter(p => p.category === category)
    if (featured) items = items.filter(p => p.featured)
    return items
  }
  let q = 'select=*&status=eq.published&order=sort_order.asc,id.asc'
  if (category && category !== 'all') q += `&category=eq.${encodeURIComponent(category)}`
  if (featured) q += '&featured=is.true'
  return await db.select('products', q)
}

async function getProduct(id) {
  if (!isConfigured()) return PRODUCTS.find(p => String(p.id) === String(id)) || null
  const rows = await db.select('products', `select=*&id=eq.${encodeURIComponent(id)}&limit=1`)
  return rows[0] || null
}

// 后台用：全部商品（含草稿、下架）
async function listAllProducts() {
  if (!isConfigured()) return PRODUCTS
  return await db.select('products', 'select=*&order=sort_order.asc,id.asc')
}

function slugify(s) {
  return String(s || 'item')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60) || 'item'
}

// 有 id 视为编辑，无 id 视为新增
async function saveProduct(p) {
  ensureBackend()
  const payload = {
    name_en: p.name_en,
    name_zh: p.name_zh,
    subtitle_en: p.subtitle_en || null,
    subtitle_zh: p.subtitle_zh || null,
    description_en: p.description_en || null,
    description_zh: p.description_zh || null,
    specs_en: p.specs_en || [],
    specs_zh: p.specs_zh || [],
    category: p.category || 'general',
    price_usd: Number(p.price_usd || 0),
    price_cny: Number(p.price_cny || 0),
    stock: parseInt(p.stock || 0, 10),
    image_url: p.image_url || null,
    status: p.status || 'published',
    featured: !!p.featured,
    updated_at: new Date().toISOString(),
  }
  if (p.id) {
    return await db.update('products', payload, `id=eq.${encodeURIComponent(p.id)}`)
  }
  payload.slug = p.slug || slugify(p.name_en) + '-' + Date.now().toString(36).slice(-4)
  payload.sort_order = Number(p.sort_order || 999)
  return await db.insert('products', payload)
}

async function deleteProduct(id) {
  ensureBackend()
  return await db.remove('products', `id=eq.${encodeURIComponent(id)}`)
}

// 只改上下架状态，不动其他字段（saveProduct 会整行覆盖，别拿来干这个）
async function updateProductStatus(id, status) {
  ensureBackend()
  return await db.update('products',
    { status, updated_at: new Date().toISOString() },
    `id=eq.${encodeURIComponent(id)}`)
}

// ---------------- 订单 ----------------

async function createOrder(order) {
  ensureBackend()
  const u = getUser()
  const payload = {
    order_no: order.order_no,
    user_id: u ? u.id : null,
    customer_email: order.customer_email,
    items: order.items,
    currency: order.currency,
    subtotal: Number(order.subtotal || 0),
    shipping_fee: Number(order.shipping_fee || 0),
    total: Number(order.total || 0),
    status: order.status || 'pending',
    payment_method: order.payment_method || null,
    shipping_name: order.shipping_name || null,
    shipping_phone: order.shipping_phone || null,
    shipping_address: order.shipping_address || null,
    note: order.note || null,
  }
  // 登录用户能读回自己这单（orders_read_own 策略放行 RETURNING）；
  // 游客没有订单读取权限，必须走 minimal，否则整条插入会被拒。
  return await db.insert('orders', payload, { returning: !!u })
}

async function listMyOrders() {
  ensureBackend()
  const u = getUser()
  if (!u) return []
  return await db.select('orders', `select=*&user_id=eq.${u.id}&order=created_at.desc&limit=100`)
}

async function listAllOrdersAdmin() {
  ensureBackend()
  return await db.select('orders', 'select=*&order=created_at.desc&limit=300')
}

async function updateOrderStatusAdmin(id, status) {
  ensureBackend()
  const patch = { status, updated_at: new Date().toISOString() }
  if (status === 'paid') patch.paid_at = new Date().toISOString()
  return await db.update('orders', patch, `id=eq.${encodeURIComponent(id)}`)
}

async function markOrderPaid(id) {
  return await updateOrderStatusAdmin(id, 'paid')
}

/* ===== auth.js ===== */
// SIMDT store — 登录层（Supabase Auth，邮箱 + 密码）
//
// 真登录：密码由 Supabase 校验，Token 是签名的 JWT，前端伪造不了。
// isAdmin() 只用来决定「要不要显示后台入口」，真正的写权限由数据库端
// 的 RLS 策略强制（见 supabase/schema.sql）。即便有人改了前端代码，
// 也写不进商品表。



function isBackendReady() {
  return isConfigured()
}

function onAuthChange(cb) {
  const handler = () => cb(auth.getUser())
  window.addEventListener('auth-changed', handler)
  window.addEventListener('storage', handler)
  return () => {
    window.removeEventListener('auth-changed', handler)
    window.removeEventListener('storage', handler)
  }
}

// 恢复会话（token 过期会自动刷新），失败返回 { user: null }
async function getSession() {
  if (!isConfigured()) return { user: null }
  if (!loadSession()?.refresh_token) return { user: null }
  const user = await auth.restore()
  return { user }
}

function getUser() {
  return auth.getUser()
}

async function signIn(email, password) {
  return await auth.signIn(email.trim().toLowerCase(), password)
}

async function signUp(email, password) {
  return await auth.signUp(email.trim().toLowerCase(), password)
}

async function signOut() {
  return await auth.signOut()
}

// 后端判定优先；本地白名单只作为「入口显示」的兜底（后端不可用时也能进页面）
function isAdmin(user) {
  if (!user) return false
  if (user.is_admin === true) return true
  return ADMIN_EMAILS.map(e => e.toLowerCase()).includes((user.email || '').toLowerCase())
}

function toast(msg, type = 'info') {
  const el = document.getElementById('toast')
  if (!el) return
  const div = document.createElement('div')
  div.className = 'toast toast-' + type
  div.textContent = msg
  el.appendChild(div)
  setTimeout(() => div.remove(), 3200)
}

// SIMDT store — page renderers








// 把后端错误码翻译成用户能看懂的话
function errText(e) {
  const map = {
    wrong_credentials: t('err_wrong_credentials'),
    email_registered: t('err_email_registered'),
    password_too_short: t('err_password_too_short'),
    invalid_email: t('err_invalid_email'),
    email_not_confirmed: t('err_email_not_confirmed'),
    confirm_email_sent: t('err_confirm_email_sent'),
    backend_not_configured: t('backend_not_configured'),
  }
  const key = e && e.message
  return (key && map[key]) || t('backend_error')
}

const CATEGORIES = ['all', 'dashboard', 'wheel', 'haptic', 'buttonbox', 'wind', 'shifter']
function catLabel(c) {
  if (c === 'all') return t('category_all')
  const label = t('cat_' + c)
  return label === 'cat_' + c ? c : label
}

const INQUIRY_MAIL = 'simdt@qq.com'
function inquiryHref(p) {
  const name = getLang() === 'zh' ? p.name_zh : p.name_en
  return `mailto:${INQUIRY_MAIL}?subject=${encodeURIComponent(t('inquire_subject') + ' - ' + name)}`
}

// Live chat when configured, email link otherwise. The link carries the product
// name so the agent knows what the visitor is asking about.
function chatLinkHTML(p) {
  const name = getLang() === 'zh' ? p.name_zh : p.name_en
  if (chatReady()) {
    return `<a href="#" data-inquire="${name.replace(/"/g, '&quot;')}" style="color:var(--gold)">${t('talk_to_us')}</a>`
  }
  return `<a href="${inquiryHref(p)}" style="color:var(--gold)">${t('talk_to_us')}</a>`
}

function productCardHTML(p) {
  const name = getLang() === 'zh' ? `${p.name_zh}<span class="zh"> ${p.name_en}</span>` : p.name_en
  const inq = isInquiry(p)
  // 询价商品不该被库存挡住 —— 客户要的是报价，不是现货
  const blocked = p.stock <= 0 && !inq
  const addLabel = blocked ? t('out_of_stock') : (inq ? t('add_to_quote') : t('add_to_cart'))
  return `<div class="card">
    <a class="card-img" href="#/product/${p.id}"><img src="${productImage(p.image_url)}" alt="${p.name_en}" loading="lazy"></a>
    <div class="card-body">
      <div class="card-cat">${catLabel(p.category)}</div>
      <div class="card-title">${name}</div>
      <div class="card-price">${priceText(p)}</div>
      <div class="card-actions">
        <a class="btn" href="#/product/${p.id}">${t('details')}</a>
        <button class="btn btn-primary" data-action="add" data-id="${p.id}" ${blocked ? 'disabled' : ''}>${addLabel}</button>
      </div>
    </div>
  </div>`
}

function bindAddButtons(scope) {
  scope.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-action="add"]')
    if (!btn || btn.disabled) return
    try {
      const p = await getProduct(btn.dataset.id)
      addToCart(p, 1)
      toast((isInquiry(p) ? t('added_to_quote') : t('add_to_cart')) + ' ✓', 'success')
    } catch (err) { toast(errText(err), 'error') }
  })
}

async function home() {
  const app = document.getElementById('app')
  app.innerHTML = `
    <section class="hero">
      <h1 class="hero-title">${t('home_hero_title')}</h1>
      <p class="hero-sub">${t('home_hero_sub')}</p>
      <a href="#/products" class="btn btn-primary hero-cta">${t('home_shop_btn')}</a>

      <h2 class="section-title">${t('home_featured')}</h2>
      <div class="grid" id="featured-grid"><div class="empty">${t('loading')}</div></div>
    </section>`
  try {
    const items = await listProducts({ featured: true })
    const grid = document.getElementById('featured-grid')
    grid.innerHTML = items.length ? items.map(productCardHTML).join('') : `<div class="empty">${t('products_empty')}</div>`
    bindAddButtons(grid)

async function products(ctx) {
  const active = ctx.params.category || 'all'
  const app = document.getElementById('app')
  app.innerHTML = `
    <section class="section">
      <h2 class="section-title">${t('products_title')}</h2>
      <div class="filters" id="cat-filters">
        ${CATEGORIES.map(c => `<button class="chip ${c === active ? 'active' : ''}" data-cat="${c}">${catLabel(c)}</button>`).join('')}
      </div>
      <div class="grid" id="prod-grid"><div class="empty">${t('loading')}</div></div>
    </section>`
  const grid = document.getElementById('prod-grid')
  await loadGrid(grid, active)
  document.getElementById('cat-filters').addEventListener('click', (e) => {
    const chip = e.target.closest('[data-cat]')
    if (!chip) return
    location.hash = '#/products/' + chip.dataset.cat
  })
  bindAddButtons(grid)
}

async function loadGrid(grid, cat) {
  try {
    const items = await listProducts({ category: cat })
    grid.innerHTML = items.length ? items.map(productCardHTML).join('') : `<div class="empty">${t('products_empty')}</div>`
  } catch (e) { grid.innerHTML = `<div class="empty">${errText(e)}</div>` }
}

        <div style="flex:1;min-width:280px"><img src="${productImage(p.image_url)}" alt="${p.name_en}" style="border-radius:12px;background:#000;width:100%"></div>
        <div style="flex:1;min-width:280px">
          <div class="card-cat">${catLabel(p.category)}</div>
          <h1 style="font-size:26px;margin:6px 0">${name}</h1>
          ${sub ? `<div style="color:var(--muted);font-size:14px">${sub}</div>` : ''}
          <div class="card-price" style="font-size:26px;margin:10px 0">${priceText(p)}</div>
          <p style="margin:14px 0;color:var(--muted)">${desc || ''}</p>
          ${specs.length ? `<div class="spec-row">${specs.map(s => `<span class="spec-pill">${s}</span>`).join('')}</div>` : ''}
          <p style="color:var(--muted);margin-top:12px">${t('stock')}: ${p.stock}</p>
          <div class="row" style="max-width:340px;align-items:flex-end">
            <div class="field"><label>${t('qty')}</label><input id="pd-qty" type="number" min="1" value="1"></div>
            <button class="btn btn-primary" id="pd-buy" ${blocked ? 'disabled' : ''}>${addLabel}</button>
          </div>
          <p style="margin-top:12px;font-size:13px;color:var(--muted)">${inq ? t('quote_notice_short') : ''} ${chatLinkHTML(p)}</p>
        </div>
      </div>`
    const buy = document.getElementById('pd-buy')
    if (buy && !blocked) {
      buy.addEventListener('click', async () => {
        const qty = Math.max(1, parseInt(document.getElementById('pd-qty').value) || 1)
        addToCart(p, qty)
        toast((inq ? t('added_to_quote') : t('add_to_cart')) + ' ✓', 'success')
      })
    }
  } catch (e) { app.innerHTML = `<div class="empty">${errText(e)}</div>` }
}

function cartItemHTML(i) {
  const name = getLang() === 'zh' ? i.name_zh : i.name_en
  const inq = isInquiry(i)
  const priceLine = inq ? t('price_on_request') : money(productPrice(i))
  return `<div class="cart-item">
    <img src="${productImage(i.image_url)}" alt="">
    <div class="info">
      <div style="font-weight:600">${name}</div>
      <div class="order-meta">${priceLine} × ${i.qty}</div>
    </div>
    <input class="field cart-qty" type="number" min="1" value="${i.qty}" data-id="${i.id}">
    <button class="btn btn-danger" data-action="remove" data-id="${i.id}">${t('cart_remove')}</button>
  </div>`
}

async function cart() {
  const app = document.getElementById('app')
  const items = getCart()
  if (!items.length) {
    app.innerHTML = `<div class="empty">${t('cart_empty')}<br><br><a href="#/products" class="btn btn-primary">${t('cart_continue')}</a></div>`
    return
  }
  const quote = hasInquiryItems()
  const priced = pricedSubtotal()
  app.innerHTML = `
    <h2 class="section-title">${quote ? t('quote_title') : t('cart_title')}</h2>
    ${quote ? `<p style="color:var(--muted);margin-bottom:12px">${t('quote_notice')}</p>` : ''}
    <div id="cart-list">${items.map(cartItemHTML).join('')}</div>
    <div class="summary">
      ${quote && priced > 0 ? `<div class="line"><span>${t('subtotal_priced')}</span><span>${money(priced)}</span></div>` : ''}
      ${quote ? '' : `<div class="line"><span>${t('cart_subtotal')}</span><span>${money(priced)}</span></div>`}
      <div class="total line"><span>${t('order_total')}</span><span>${quote ? t('price_on_request') : money(priced)}</span></div>
      <a href="#/checkout" class="btn btn-primary btn-block" style="margin-top:14px">${quote ? t('quote_next') : t('cart_checkout')}</a>
    </div>`
  const list = document.getElementById('cart-list')
  list.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action="remove"]')
    if (!btn) return
    removeFromCart(Number(btn.dataset.id))
    cart() // re-render
  })
  list.addEventListener('change', (e) => {
    if (e.target.classList.contains('cart-qty')) {
      updateQty(Number(e.target.dataset.id), parseInt(e.target.value) || 1)
      cart()
    }
  })
}

function payOpt(method, key) {
  const labelMap = { stripe: t('pay_stripe'), paypal: t('pay_paypal'), wechat: t('pay_wechat'), alipay: t('pay_alipay') }
  if (key) return `<div class="pay-opt" data-method="${method}"><b>${labelMap[method]}</b></div>`
  return `<div class="pay-opt locked" data-method="${method}"><b>${labelMap[method]}</b><span class="disabled-tag">${t('pay_not_ready')}</span></div>`
}

// 一个支付渠道都没接时，不要给客户看「演示支付（测试）」和「待接入」
// 这类内部话术，改成一句正经的「下单后邮件确认付款方式」。
function hasPaymentChannel() {
  return Object.values(PAYMENT_KEYS || {}).some(Boolean)
}

function defaultPayMethod() {
  return hasPaymentChannel() ? 'demo' : 'invoice'
}

function payMethodsHTML() {
  if (!hasPaymentChannel()) {
    return `<div class="pay-methods" id="pay-methods">
      <div class="pay-opt active" data-method="invoice" style="display:block">
        <b style="display:block;margin-bottom:6px">${t('pay_invoice')}</b>
        <div class="order-meta" style="line-height:1.6">${t('pay_invoice_desc')}</div>
      </div>
    </div>`
  }
  return `<div class="pay-methods" id="pay-methods">
    <div class="pay-opt active" data-method="demo"><b>${t('pay_demo')}</b></div>
    ${payOpt('stripe', PAYMENT_KEYS.stripe)}
    ${payOpt('paypal', PAYMENT_KEYS.paypal)}
    ${payOpt('wechat', PAYMENT_KEYS.wechat)}
    ${payOpt('alipay', PAYMENT_KEYS.alipay)}
  </div>`
}

function isEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s) }

function quoteRowHTML(i) {
  const name = getLang() === 'zh' ? i.name_zh : i.name_en
  return `<div class="order-item">
    <img src="${productImage(i.image_url)}" alt="">
    <div style="flex:1">
      <div>${name}</div>
      <div class="order-meta">${isInquiry(i) ? t('price_on_request') : money(productPrice(i))} × ${i.qty}</div>
    </div>
  </div>`
}

// 询价单流程：9 款商品目前全部未定价，客户要的不是「加入购物车」而是「给我报价」。
// 提交后落库为 status=inquiry / payment_method=quote 的订单，后台和邮件里都能跟进。
async function checkoutQuote(ctx) {
  const app = document.getElementById('app')
  const items = getCart()
  const priced = pricedSubtotal()
  app.innerHTML = `
    <h2 class="section-title">${t('quote_title')}</h2>
    <p style="color:var(--muted);margin-bottom:16px">${t('quote_notice')}</p>
    <div style="display:flex;gap:24px;flex-wrap:wrap">
      <div style="flex:1;min-width:300px">
        <h3 style="margin-bottom:10px">${t('quote_form_title')}</h3>
        <div class="field"><label>${t('name')}*</label><input id="q-name"></div>
        <div class="field"><label>${t('email')}*</label><input id="q-email" type="email" value="${(ctx.user && ctx.user.email) || ''}"></div>
        <div class="field"><label>${t('company')}</label><input id="q-company"></div>
        <div class="field"><label>${t('country')}*</label><input id="q-country" placeholder="Italy / Germany / USA ..."></div>
        <div class="field"><label>${t('phone')}</label><input id="q-phone"></div>
        <div class="field"><label>${t('requirements')}</label><textarea id="q-req" rows="3"></textarea></div>
      </div>
      <div style="flex:1;min-width:300px">
        <h3 style="margin-bottom:10px">${t('order_items')}</h3>
        ${items.map(quoteRowHTML).join('')}
        <div class="summary" style="margin-top:14px">
          ${priced > 0 ? `<div class="line"><span>${t('subtotal_priced')}</span><span>${money(priced)}</span></div>` : ''}
          <div class="total line"><span>${t('order_total')}</span><span>${t('price_on_request')}</span></div>
          <button class="btn btn-primary btn-block" id="q-place" style="margin-top:14px">${t('quote_submit')}</button>
        </div>
      </div>
    </div>`

  const btn = app.querySelector('#q-place')
  btn.addEventListener('click', async () => {
    const name = app.querySelector('#q-name').value.trim()
    const email = app.querySelector('#q-email').value.trim()
    const company = app.querySelector('#q-company').value.trim()
    const country = app.querySelector('#q-country').value.trim()
    const phone = app.querySelector('#q-phone').value.trim()
    const req = app.querySelector('#q-req').value.trim()
    if (!name || !email || !country) { toast(t('fill_required'), 'error'); return }
    if (!isEmail(email)) { toast(t('err_invalid_email'), 'error'); return }
    const order = {
      order_no: 'RFQ' + Date.now().toString(36).toUpperCase(),
      items: items.map(i => ({
        product_id: i.id,
        name: getLang() === 'zh' ? i.name_zh : i.name_en,
        price: isInquiry(i) ? 0 : Number(productPrice(i)) || 0,
        qty: i.qty,
        image: i.image_url,
        quote: isInquiry(i),
      })),
      currency: getCurrency(),
      subtotal: priced,
      total: priced,
      shipping_fee: 0,
      status: 'inquiry',
      payment_method: 'quote',
      customer_email: email,
      shipping_name: name,
      shipping_phone: phone || null,
      shipping_address: null,
      note: [
        company ? 'Company: ' + company : '',
        'Country: ' + country,
        req ? 'Requirements: ' + req : '',
      ].filter(Boolean).join('\n'),
    }
    btn.disabled = true; btn.textContent = t('loading')
    try {
      const created = await createOrder(order)
      if (ORDER_WEBHOOK_URL) {
        try { await fetch(ORDER_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(created || order) }) } catch (_) {}
      }
      const no = (created && created.order_no) || order.order_no
      const first = getLang() === 'zh' ? items[0].name_zh : items[0].name_en
      clearCart()
      app.innerHTML = `<div class="empty" style="padding:40px 20px">
        <div style="font-size:18px;color:var(--gold);margin-bottom:12px">${t('quote_success_hint')}</div>
        <div style="font-size:26px;font-weight:700;letter-spacing:1px;margin-bottom:16px">${no}</div>
        <div style="color:var(--muted);margin-bottom:8px">${t('quote_success_note')}</div>
        <div style="color:var(--muted);margin-bottom:20px;font-size:13px">${t('quote_save')}</div>
        ${chatReady() ? `<button class="btn btn-primary" data-inquire="${first.replace(/"/g, '&quot;')}">${t('talk_to_us')}</button>` : ''}
        <a class="btn" href="#/products" style="margin-left:8px">${t('nav_products')}</a>
      </div>`
      toast(t('order_success') + ' ✓', 'success')
    } catch (err) {
      toast(errText(err), 'error')
      btn.disabled = false; btn.textContent = t('quote_submit')
    }
  })
}

async function checkout(ctx) {
  const app = document.getElementById('app')
  const items = getCart()
  if (!items.length) { app.innerHTML = `<div class="empty">${t('cart_empty')}</div>`; return }
  // 含未定价商品 → 走询价单，不要求填收货地址、不显示支付方式
  if (hasInquiryItems()) { await checkoutQuote(ctx); return }
  const cur = getCurrency()
  app.innerHTML = `
    <h2 class="section-title">${t('checkout_title')}</h2>
    ${ctx.user ? '' : `<p style="color:var(--muted);margin-bottom:14px">${t('login_hint')} <a href="#/login" style="color:var(--gold)">${t('login_submit')}</a></p>`}
    <div style="display:flex;gap:24px;flex-wrap:wrap">
      <div style="flex:1;min-width:300px">
        <h3 style="margin-bottom:10px">${t('checkout_shipping')}</h3>
        <div class="field"><label>${t('name')}*</label><input id="ck-name"></div>
        <div class="field"><label>${t('email')}*</label><input id="ck-email" value="${(ctx.user && ctx.user.email) || ''}"></div>
        <div class="field"><label>${t('phone')}</label><input id="ck-phone"></div>
        <div class="field"><label>${t('address')}*</label><textarea id="ck-address" rows="3"></textarea></div>
      </div>
      <div style="flex:1;min-width:300px">
        <h3 style="margin-bottom:10px">${t('order_items')}</h3>
        ${items.map(cartItemHTML).join('')}
        <h3 style="margin:14px 0 10px">${t('payment')}</h3>
        ${payMethodsHTML()}
        <div class="summary" style="margin-top:14px">
          <div class="line"><span>${t('cart_subtotal')}</span><span>${money(cartSubtotal())}</span></div>
          <div class="total line"><span>${t('order_total')}</span><span>${money(cartSubtotal())}</span></div>
          <button class="btn btn-primary btn-block" id="ck-place" style="margin-top:14px">${t('place_order')}</button>
        </div>
      </div>
    </div>`
  let method = defaultPayMethod()
  const pm = app.querySelector('#pay-methods')
  pm.addEventListener('click', (e) => {
    const opt = e.target.closest('.pay-opt')
    if (!opt || opt.classList.contains('locked')) return
    pm.querySelectorAll('.pay-opt').forEach(o => o.classList.remove('active'))
    opt.classList.add('active')
    method = opt.dataset.method
  })
  app.querySelector('#ck-place').addEventListener('click', async () => {
    const name = app.querySelector('#ck-name').value.trim()
    const email = app.querySelector('#ck-email').value.trim()
    const address = app.querySelector('#ck-address').value.trim()
    if (!name || !email || !address) { toast(t('fill_required'), 'error'); return }
    const cur = getCurrency()
    // 演示支付（demo）直接记已支付；接入真实支付渠道后应改为 pending，
    // 再由支付回调或后台手工改 paid，避免"没付钱就算付款"。
    const order = {
      order_no: 'SIM' + Date.now().toString(36).toUpperCase(),
      items: items.map(i => ({ product_id: i.id, name: getLang() === 'zh' ? i.name_zh : i.name_en, price: Number(productPrice(i)) || 0, qty: i.qty, image: i.image_url })),
      currency: cur,
      subtotal: cartSubtotal(),
      total: cartSubtotal(),
      shipping_fee: 0,
      status: 'pending',
      payment_method: method,
      customer_email: email,
      shipping_name: name,
      shipping_phone: app.querySelector('#ck-phone').value.trim(),
      shipping_address: address,
    }
    const btn = app.querySelector('#ck-place')
    btn.disabled = true; btn.textContent = t('loading')
    const reset = () => { btn.disabled = false; btn.textContent = t('place_order') }
    try {
      const created = await createOrder(order)
      // 可选：把订单转发到你的邮箱 API / 自有后端做备份通知
      if (ORDER_WEBHOOK_URL) {
        try { await fetch(ORDER_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(created || order) }) } catch (_) {}
      }
      clearCart()
      if (ctx.user) {
        toast(t('order_success') + ' ✓', 'success')
        location.hash = '#/orders'
      } else {
        // 游客下单：没有账号就查不到订单历史，直接把订单号亮出来让他记下
        // 游客下单走 return=minimal，数据库不回传整行，created 为 null，
        // 订单号用前端生成的那个兜底。
        app.innerHTML = `<div class="empty" style="padding:40px 20px">
          <div style="font-size:18px;color:var(--gold);margin-bottom:12px">${t('order_guest_hint')}</div>
          <div style="font-size:26px;font-weight:700;letter-spacing:1px;margin-bottom:16px">${(created && created.order_no) || order.order_no}</div>
          <div style="color:var(--muted);margin-bottom:8px">${t('order_guest_save')}</div>
          <div style="color:var(--gold);margin-bottom:20px;font-size:13px">${t('order_pending_note')}</div>
          <a class="btn btn-primary" href="#/login">${t('nav_login')}</a>
          <a class="btn" href="#/products" style="margin-left:8px">${t('nav_products')}</a>
        </div>`
      }
    } catch (err) {
      toast(errText(err), 'error')
      reset()
    }
  })
}

function orderCardHTML(o) {
  const items = (o.items || []).map(it => `<div class="order-item"><img src="${productImage(it.image)}"><div style="flex:1"><div>${it.name}</div><div class="order-meta">${it.quote ? t('price_on_request') : money(it.price)} × ${it.qty}</div></div></div>`).join('')
  const quote = o.payment_method === 'quote'
  return `<div class="order-card" style="flex-direction:column;align-items:stretch">
    <div style="display:flex;justify-content:space-between">

async function orders(ctx) {
  const app = document.getElementById('app')
  if (!ctx.user) {
    app.innerHTML = `<div class="empty">${t('checkout_login_required')}<br><br><a href="#/login" class="btn btn-primary">${t('nav_login')}</a></div>`

async function login() {
  const app = document.getElementById('app')
  let mode = 'signin'

  function draw() {
    const isSignup = mode === 'signup'
    app.innerHTML = `
      <div style="max-width:380px;margin:30px auto">
        <h2 class="section-title">${isSignup ? t('login_register_title') : t('login_title')}</h2>
        <p style="color:var(--muted);margin-bottom:14px">${t('login_hint')}</p>
        <div class="field"><label>${t('login_email')}</label><input id="lg-email" type="email" autocomplete="email" placeholder="you@example.com"></div>
        <div class="field"><label>${t('login_password')}</label><input id="lg-pass" type="password" autocomplete="${isSignup ? 'new-password' : 'current-password'}" placeholder="${t('login_password_hint')}"></div>
        <button class="btn btn-primary btn-block" id="lg-go">${isSignup ? t('login_register_submit') : t('login_submit')}</button>
        <p style="text-align:center;margin-top:14px;color:var(--muted)">
          ${isSignup ? t('login_have_account') : t('login_no_account')}
          <a href="#" id="lg-toggle" style="color:var(--gold)">${isSignup ? t('login_to_signin') : t('login_to_register')}</a>
        </p>
        ${isBackendReady() ? '' : `<div class="empty" style="margin-top:16px">${t('backend_not_configured')}</div>`}
      </div>`

    app.querySelector('#lg-toggle').addEventListener('click', (e) => {
      e.preventDefault()
      mode = isSignup ? 'signin' : 'signup'
      draw()
    })

    const submit = async () => {
      const email = app.querySelector('#lg-email').value.trim()
      const pass = app.querySelector('#lg-pass').value
      if (!email || !pass) { toast(t('fill_required'), 'error'); return }
      const btn = app.querySelector('#lg-go')
      btn.disabled = true; btn.textContent = t('loading')
      try {
        if (mode === 'signup') await signUp(email, pass)
        else await signIn(email, pass)
        toast(t('saved') + ' ✓', 'success')
        location.hash = '#/'
      } catch (err) {
        toast(errText(err), 'error')
        btn.disabled = false
        btn.textContent = mode === 'signup' ? t('login_register_submit') : t('login_submit')
      }
    }

    app.querySelector('#lg-go').addEventListener('click', submit)
    app.querySelector('#lg-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit() })
  }

  draw()
}

async function admin(ctx) {
  const app = document.getElementById('app')
  if (!ctx.user || !isAdmin(ctx.user)) { app.innerHTML = `<div class="empty">${t('not_admin')}</div>`; return }
  if (!isBackendReady()) { app.innerHTML = `<div class="empty">${t('admin_no_backend')}</div>`; return }
  const tab = ctx.params.tab || 'products'
  app.innerHTML = `
    <h2 class="section-title">${t('admin_title')}</h2>
    <div class="admin-tabs">
      <button class="chip ${tab === 'products' ? 'active' : ''}" data-tab="products">${t('admin_products')}</button>
      <button class="chip ${tab === 'orders' ? 'active' : ''}" data-tab="orders">${t('admin_orders')}</button>
    </div>
    <div id="admin-body"><div class="empty">${t('loading')}</div></div>`
  app.querySelector('.admin-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]')
    if (!b) return
    location.hash = '#/admin/' + b.dataset.tab

  if (tab === 'products') await renderAdminProducts(body)
  else await renderAdminOrders(body)

          <button class="btn" data-edit="${p.id}">${t('admin_edit')}</button>
          <button class="btn" data-toggle="${p.id}" data-next="${p.status === 'published' ? 'draft' : 'published'}">${p.status === 'published' ? t('admin_unpublish') : t('admin_publish')}</button>
          <button class="btn btn-danger" data-del="${p.id}">${t('admin_delete')}</button>
        </td>
      </tr>`).join('')}</tbody>
    </table>`
  body.querySelector('#adm-new').addEventListener('click', () => openProductModal(body, null))
  body.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', async () => {
    try {
      const p = await getProduct(b.dataset.edit)
      openProductModal(body, p)
    } catch (e) { toast(errText(e), 'error') }
  }))
  // 一键上架 / 下架
  body.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true
    try {
      await updateProductStatus(b.dataset.toggle, b.dataset.next)
      toast(t('saved'), 'success')
      renderAdminProducts(body)
    } catch (e) { toast(errText(e), 'error'); b.disabled = false }
  }))
  body.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(t('admin_confirm_delete'))) return
    try { await deleteProduct(b.dataset.del); toast(t('saved'), 'success'); renderAdminProducts(body) }
    catch (e) { toast(errText(e), 'error') }
  }))
}

function openProductModal(body, p) {
  const mask = document.createElement('div')
  mask.className = 'modal-mask'
  const isNew = !p
  const v = (k, d = '') => (p ? (p[k] ?? d) : d)
  const specsStr = (arr) => (Array.isArray(arr) ? arr.join(', ') : '')
  mask.innerHTML = `
    <div class="modal-box">
      <h3>${isNew ? t('admin_new_product') : t('admin_edit')}</h3>
      <div class="row">
        <div class="field"><label>${t('admin_field_name_en')}*</label><input id="m-name_en" value="${v('name_en')}"></div>
        <div class="field"><label>${t('admin_field_name_zh')}*</label><input id="m-name_zh" value="${v('name_zh')}"></div>
      </div>
      <div class="row">
        <div class="field"><label>${t('admin_field_subtitle_en')}</label><input id="m-sub_en" value="${v('subtitle_en')}"></div>
        <div class="field"><label>${t('admin_field_subtitle_zh')}</label><input id="m-sub_zh" value="${v('subtitle_zh')}"></div>
      </div>
      <div class="row">
        <div class="field"><label>${t('admin_field_category')}</label><input id="m-cat" value="${v('category', 'general')}"></div>
        <div class="field"><label>${t('admin_field_stock')}</label><input id="m-stock" type="number" value="${v('stock', 0)}"></div>
      </div>
      <div class="row">
        <div class="field"><label>${t('admin_field_price_usd')}</label><input id="m-usd" type="number" step="0.01" value="${v('price_usd', 0)}"></div>
        <div class="field"><label>${t('admin_field_price_cny')}</label><input id="m-cny" type="number" step="0.01" value="${v('price_cny', 0)}"></div>
      </div>
      <div class="field"><label>${t('admin_field_status')}</label><select id="m-status">
        <option value="published" ${v('status') === 'published' ? 'selected' : ''}>${t('status_published')}</option>
        <option value="draft" ${v('status') === 'draft' ? 'selected' : ''}>${t('status_draft')}</option>
        <option value="archived" ${v('status') === 'archived' ? 'selected' : ''}>${t('status_archived')}</option>
      </select></div>
      <div class="field"><label>${t('admin_field_image')}</label><input id="m-img" value="${v('image_url')}" placeholder="https://..."></div>
      <div class="field"><label>${t('admin_field_desc_en')}</label><textarea id="m-desc_en" rows="2">${v('description_en')}</textarea></div>
      <div class="field"><label>${t('admin_field_desc_zh')}</label><textarea id="m-desc_zh" rows="2">${v('description_zh')}</textarea></div>
      <div class="field"><label>${t('admin_field_specs_en')}</label><input id="m-specs_en" value="${specsStr(v('specs_en', []))}"></div>
      <div class="field"><label>${t('admin_field_specs_zh')}</label><input id="m-specs_zh" value="${specsStr(v('specs_zh', []))}"></div>
      <div class="field"><label><input type="checkbox" id="m-feat" ${v('featured') ? 'checked' : ''}> ${t('admin_field_featured')}</label></div>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn btn-primary" id="m-save">${t('admin_save')}</button>
        <button class="btn" id="m-cancel">${t('admin_cancel')}</button>
      </div>
    </div>`
  document.body.appendChild(mask)
  mask.querySelector('#m-cancel').addEventListener('click', () => mask.remove())
  mask.addEventListener('click', (e) => { if (e.target === mask) mask.remove() })
  mask.querySelector('#m-save').addEventListener('click', async () => {
    const toArr = (sel) => mask.querySelector(sel).value.split(',').map(s => s.trim()).filter(Boolean)
    const payload = {
      name_en: mask.querySelector('#m-name_en').value.trim(),
      name_zh: mask.querySelector('#m-name_zh').value.trim(),
      subtitle_en: mask.querySelector('#m-sub_en').value.trim() || null,
      subtitle_zh: mask.querySelector('#m-sub_zh').value.trim() || null,
      category: mask.querySelector('#m-cat').value.trim() || 'general',
      stock: parseInt(mask.querySelector('#m-stock').value || 0, 10),
      price_usd: parseFloat(mask.querySelector('#m-usd').value || 0),
      price_cny: parseFloat(mask.querySelector('#m-cny').value || 0),
      status: mask.querySelector('#m-status').value,
      image_url: mask.querySelector('#m-img').value.trim() || null,
      description_en: mask.querySelector('#m-desc_en').value.trim(),
      description_zh: mask.querySelector('#m-desc_zh').value.trim(),
      specs_en: toArr('#m-specs_en'),
      specs_zh: toArr('#m-specs_zh'),
      featured: mask.querySelector('#m-feat').checked,
    }
    if (!payload.name_en || !payload.name_zh) { toast(t('fill_required'), 'error'); return }
    const saveBtn = mask.querySelector('#m-save')
    saveBtn.disabled = true; saveBtn.textContent = t('loading')
    try {
      if (!isNew) payload.id = p.id
      await saveProduct(payload)
      mask.remove()
      toast(t('saved'), 'success')
      renderAdminProducts(body)
    } catch (e) {
      toast(errText(e), 'error')
      saveBtn.disabled = false; saveBtn.textContent = t('admin_save')
    }
  })
}

async function renderAdminOrders(body) {
  let list
  try {
    list = await listAllOrdersAdmin()
  } catch (e) {
    body.innerHTML = `<div class="empty">${errText(e)}</div>`
    return
  }
  if (!list.length) { body.innerHTML = `<div class="empty">${t('admin_orders_empty')}</div>`; return }

  const statusOpts = ['inquiry', 'quoted', 'pending', 'paid', 'shipped', 'completed', 'cancelled', 'failed']
  const amt = (o) => (o.payment_method === 'quote' ? t('price_on_request') : (o.currency === 'CNY' ? '¥' : '$') + Number(o.total || 0).toFixed(2))

  body.innerHTML = `<table class="table">
    <thead><tr><th>#</th><th>${t('admin_customer')}</th><th>${t('order_items')}</th><th>${t('order_total')}</th><th>${t('order_status')}</th><th></th></tr></thead>
    <tbody>${list.map(o => `<tr>
      <td>#${o.order_no}<br><span class="order-meta">${String(o.created_at || '').slice(0, 16).replace('T', ' ')}</span>${o.payment_method === 'quote' ? `<br><span class="status-pill status-inquiry">${t('order_kind_quote')}</span>` : ''}</td>
      <td>${o.customer_email || ''}<br><span class="order-meta">${[o.shipping_name, o.shipping_phone].filter(Boolean).join(' · ')}</span><br><span class="order-meta">${o.shipping_address || ''}</span>${o.note ? `<div class="note-box">${String(o.note).replace(/\n/g, '<br>')}</div>` : ''}</td>
      <td>${(o.items || []).map(it => `${it.name} &times;${it.qty}${it.quote ? ' <span class="order-meta">(' + t('price_on_request') + ')</span>' : ''}`).join('<br>')}</td>
      <td>${amt(o)}</td>
      <td><span class="status-pill status-${o.status}">${statusLabel(o.status)}</span></td>
      <td style="white-space:nowrap">
        <select data-status="${o.id}">${statusOpts.map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${t('status_' + s)}</option>`).join('')}</select>
        <button class="btn" data-update="${o.id}">${t('admin_order_update')}</button>
      </td>
    </tr>`).join('')}</tbody>
  </table>`

  body.querySelectorAll('[data-update]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.update
    const sel = body.querySelector(`select[data-status="${id}"]`)
    b.disabled = true
    try {
      await updateOrderStatusAdmin(id, sel.value)
      toast(t('saved'), 'success')
      renderAdminOrders(body)
    } catch (e) { toast(errText(e), 'error'); b.disabled = false }
  }))
}

const pages = { home, products, productDetail, cart, checkout, orders, login, admin };

/* ===== app.js ===== */
// SIMDT store — app entry (router + shell)






let currentUser = null

function renderShell() {
  document.getElementById('site-header').innerHTML = renderHeader(currentUser)
  document.getElementById('site-footer').innerHTML = footerHTML()
}

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '')
  const parts = raw.split('/').filter(Boolean)
  return { path: parts[0] || 'home', params: { category: parts[1], id: parts[1], tab: parts[1] } }
}

async function router() {
  const { path, params } = parseHash()
  const ctx = { user: currentUser, params }
  const map = {
    home: pages.home,
    products: pages.products,
    product: pages.productDetail,
    cart: pages.cart,
    checkout: pages.checkout,
    orders: pages.orders,
    login: pages.login,
    admin: pages.admin,
  }
  const fn = map[path] || pages.home
  try {
    await fn(ctx)
  } catch (e) {
    console.error(e)
    document.getElementById('app').innerHTML = `<div class="empty">${t('error')}</div>`
  }
  window.scrollTo(0, 0)
}

function bindHeader() {
  document.getElementById('site-header').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-action]')
    if (!btn) return
    const action = btn.dataset.action
    if (action === 'lang') {
      setLang(getLang() === 'zh' ? 'en' : 'zh')
      renderShell(); router()
    } else if (action === 'currency') {
      setCurrency(getCurrency() === 'CNY' ? 'USD' : 'CNY')
      renderShell(); router()
    } else if (action === 'logout') {
      if (confirm(t('confirm_logout'))) {
        try { await signOut() } catch (err) { /* ignore */ }
        location.hash = '#/'
      }
    }
  })
}

function bindChat() {
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-inquire]')
    if (!btn) return
    e.preventDefault()
    chatOpen(btn.dataset.inquire)
  })
}

async function init() {
  renderShell()
  bindHeader()
  bindChat()
  chatInit()
  try {
    const session = await getSession()
    currentUser = session?.user || null
  } catch (err) { /* not signed in */ }
  renderShell()
  window.addEventListener('hashchange', router)
  window.addEventListener('cart-updated', renderShell)
  window.addEventListener('auth-changed', async () => {
    const s = await getSession()
    currentUser = s.user
    renderShell()
  })
  router()
}

init()
